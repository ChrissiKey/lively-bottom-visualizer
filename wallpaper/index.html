<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottom Rainbow Audio Visualizer</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background-color: #0b0b12;
        }

        #background {
            position: absolute;
            inset: 0;
            z-index: -20;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        #dim {
            position: absolute;
            inset: 0;
            z-index: -10;
            background: #000;
            opacity: 0;
        }

        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="background"></div>
    <div id="dim"></div>
    <canvas id="canvas"></canvas>

    <script src="main.js"></script>
</body>

</html>
